name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Modelo 3D gerado está em dia
        run: |
          pip install --quiet pillow
          python3 design/model/gen_landship.py
          git diff --exit-code -- 'design/model/*.json' 'src/main/resources/assets/vapor_trilhos/geckolib'

      - uses: actions/upload-artifact@v4
        with:
          name: vapor-trilhos-jar
          path: build/libs/*.jar
          if-no-files-found: error

  client-gametest:
    # abre o jogo de verdade (tela virtual), cria um mundo, pilota o landship e tira prints
    runs-on: ubuntu-latest
    # se o jogo não conseguir abrir a janela ele trava em vez de sair; não deixa o job pendurado
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Tela virtual e OpenGL por software
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libegl1 libgl1-mesa-dri libegl-mesa0

      - name: Client GameTest
        env:
          # o 26.3 cria a janela com SDL3; no Xvfb o caminho que funciona é EGL
          SDL_VIDEO_FORCE_EGL: '1'
        run: xvfb-run -a -s "-screen 0 1280x720x24+32 +extension GLX +render" ./gradlew runClientGameTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-gametest-screenshots
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: warn

  bedrock:
    # versão Bedrock (bedrock/): tipos, testes da caldeira, montagem do .mcaddon e conferência
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bedrock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bedrock/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check

      - uses: actions/upload-artifact@v4
        with:
          name: vapor-trilhos-mcaddon
          path: bedrock/dist/*.mcaddon
          if-no-files-found: error
