plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// GeckoLib. Em ambientes sem acesso ao repositório do GeckoLib, compile-o a partir do
	// código-fonte (publishToMavenLocal) e rode o Gradle com -Pvt.localGeckolib=true.
	if (providers.gradleProperty('vt.localGeckolib').isPresent()) {
		mavenLocal {
			content { includeGroup 'com.geckolib' }
		}
	} else {
		maven {
			name = 'GeckoLib'
			url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
			content { includeGroup 'com.geckolib' }
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"vapor_trilhos" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
}

processResources {
	def props = [
			version          : project.version,
			minecraft_version: project.minecraft_version,
			loader_version   : project.loader_version,
			geckolib_version : project.geckolib_version,
	]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}
}
